<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="구글 시트와 연결된 여행 일정표">
  <title>여행 일정</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%97%BA%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="stickytop">
  <header class="topbar">
    <div class="topbar__text">
      <h1 id="tripTitle">여행 일정</h1>
      <p id="tripSubtitle" hidden></p>
    </div>
    <div class="topbar__actions">
      <span id="updatedAt" class="updated"></span>
      <button id="refreshBtn" class="iconbtn" type="button" title="시트에서 다시 불러오기" aria-label="다시 불러오기">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="viewnav" role="tablist">
    <button type="button" role="tab" data-view="itinerary" class="is-active" aria-selected="true">일정</button>
    <button type="button" role="tab" data-view="budget" aria-selected="false">예산</button>
    <button type="button" role="tab" data-view="bookings" aria-selected="false">예약</button>
    <button type="button" role="tab" data-view="packing" aria-selected="false">준비물</button>
  </nav>
  </div>

  <p id="banner" class="banner" role="status" hidden></p>

  <main class="shell">

    <section id="view-itinerary">
      <nav id="dateTabs" class="datetabs" aria-label="날짜 선택"></nav>

      <div id="dayBookings" class="daybookings" hidden></div>

      <div class="mapcard">
        <div id="map" class="map"></div>
        <div class="mapcard__foot">
          <a id="dayRoute" class="btn btn--primary" target="_blank" rel="noopener noreferrer" hidden>
            🧭 하루 전체 길찾기
          </a>
          <p id="dayRouteNote" class="note" hidden></p>
        </div>
      </div>

      <div id="timeline" class="timeline"></div>
      <p id="dayTotal" class="daytotal" hidden></p>
    </section>

    <section id="view-budget" hidden>
      <div id="budgetView"></div>
    </section>

    <section id="view-bookings" hidden>
      <div id="bookingList"></div>
    </section>

    <section id="view-packing" hidden>
      <div id="packingList"></div>
    </section>

  </main>

  <footer class="foot">
    <p>일정은 구글 시트에서 관리합니다. 시트를 고치고 이 화면을 새로고침하면 반영됩니다.</p>
  </footer>

  <script src="vendor/leaflet.js"></script>
  <script type="module" src="assets/js/main.js"></script>
</body>
</html>
